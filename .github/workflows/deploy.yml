name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # no `cache: npm` — it errors when package-lock.json is absent

      - name: Install dependencies
        # npm install (not npm ci): no lockfile is committed yet —
        # switch to `npm ci` once package-lock.json lands in the repo.
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Determine base path
        id: base
        # Project pages live under /<repo>/ ; user pages (user.github.io) at /
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate PWA icons
        run: node scripts/gen-icons.mjs

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
